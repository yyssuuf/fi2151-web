<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart.js scatter plots — PGDA</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 36px;
    background: #ffffff;
    color: #181c19;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .grid { display: flex; flex-direction: column; gap: 32px; align-items: flex-start; }
  .card { background: #ffffff; }
  canvas { display: block; }
</style>
</head>
<body>
<div class="grid">
  <div class="card"><canvas id="chart-xt" width="760" height="460"></canvas></div>
  <div class="card"><canvas id="chart-yt" width="760" height="460"></canvas></div>
  <div class="card"><canvas id="chart-xy" width="760" height="460"></canvas></div>
  <div class="card"><canvas id="chart-harmonic" width="760" height="460"></canvas></div>
  <div class="card"><canvas id="chart-magnetic" width="760" height="460"></canvas></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const C = {
  blue: "#1f4fd8",
  rust: "#c94f2a",
  green: "#2f6f4f",
  ink: "#181c19",
  muted: "#656d67",
  grid: "#e5e7e1",
};

Chart.defaults.font.family = '"Segoe UI", system-ui, sans-serif';
Chart.defaults.color = C.muted;

function baseOptions(xTitle, yTitle, title) {
  return {
    responsive: false,
    maintainAspectRatio: false,
    animation: false,
    plugins: {
      title: {
        display: true,
        text: title,
        color: C.ink,
        font: { size: 17, weight: "600" },
        padding: { bottom: 14 },
      },
      legend: {
        display: true,
        position: "bottom",
        labels: { color: C.muted, boxWidth: 18, boxHeight: 2, usePointStyle: true },
      },
      tooltip: { enabled: true },
    },
    scales: {
      x: {
        type: "linear",
        title: { display: true, text: xTitle, color: C.ink, font: { size: 13 } },
        grid: { color: C.grid, drawTicks: false },
        border: { color: C.grid },
        ticks: { color: C.muted, maxTicksLimit: 8 },
      },
      y: {
        type: "linear",
        title: { display: true, text: yTitle, color: C.ink, font: { size: 13 } },
        grid: { color: C.grid, drawTicks: false },
        border: { color: C.grid },
        ticks: { color: C.muted, maxTicksLimit: 8 },
      },
    },
  };
}

function lineDataset(label, data, color) {
  return {
    label,
    data,
    showLine: true,
    borderColor: color,
    backgroundColor: color,
    borderWidth: 2,
    pointRadius: 3,
    pointHoverRadius: 6,
    pointBackgroundColor: color,
    tension: 0,
  };
}

/* ---------- parabolic motion ---------- */

const x0 = 0, y0 = 0, v0x = 20, v0y = 40, ax = 0, ay = -10;
const tbeg = 0, tend = 8, dt = 0.5;

const pts = [];
for (let t = tbeg; t <= tend + 1e-9; t += dt) {
  const x = x0 + v0x * t + 0.5 * ax * t * t;
  const y = y0 + v0y * t + 0.5 * ay * t * t;
  pts.push({ t, x, y });
}

new Chart(document.getElementById("chart-xt"), {
  type: "scatter",
  data: { datasets: [lineDataset("data x-t", pts.map(p => ({ x: p.t, y: p.x })), C.blue)] },
  options: baseOptions("t (s)", "x (m)", "data x-t"),
});

new Chart(document.getElementById("chart-yt"), {
  type: "scatter",
  data: { datasets: [lineDataset("data y-t", pts.map(p => ({ x: p.t, y: p.y })), C.rust)] },
  options: baseOptions("t (s)", "y (m)", "data y-t"),
});

new Chart(document.getElementById("chart-xy"), {
  type: "scatter",
  data: { datasets: [lineDataset("data x-y", pts.map(p => ({ x: p.x, y: p.y })), C.green)] },
  options: baseOptions("x (m)", "y (m)", "data x-y"),
});

/* ---------- harmonic: 1-D vs 2-D ---------- */

const omega = 1.0;
const A = 1.0;
const th = [];
for (let t = 0; t <= 2 * Math.PI + 1e-9; t += 0.04) th.push(t);

function harmonicPoints(vy) {
  return th.map(t => ({ x: A * Math.cos(omega * t), y: (vy / omega) * Math.sin(omega * t) }));
}

new Chart(document.getElementById("chart-harmonic"), {
  type: "scatter",
  data: {
    datasets: [
      lineDataset("v0y = 0 (1-D)", harmonicPoints(0), C.blue),
      lineDataset("v0y = 0.5ωA (elips)", harmonicPoints(0.5 * omega * A), C.rust),
      lineDataset("v0y = ωA (lingkaran)", harmonicPoints(omega * A), C.green),
    ],
  },
  options: baseOptions("x", "y", "Osilator harmonik: 1-D, elips, lingkaran"),
});

/* ---------- magnetic: z(t) for circular vs helical ---------- */

const tm = [];
for (let t = 0; t <= 4 * Math.PI + 1e-9; t += 0.06) tm.push(t);
const vpar = 0.5;

new Chart(document.getElementById("chart-magnetic"), {
  type: "scatter",
  data: {
    datasets: [
      lineDataset("v·B = 0 (lingkaran, z = 0)", tm.map(t => ({ x: t, y: 0 })), C.blue),
      lineDataset("v·B ≠ 0 (heliks, z = v∥t)", tm.map(t => ({ x: t, y: vpar * t })), C.rust),
    ],
  },
  options: baseOptions("t", "z", "Gerak dalam medan magnet: z(t)"),
});
</script>
</body>
</html>
